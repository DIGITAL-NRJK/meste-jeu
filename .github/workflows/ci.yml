name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://user:password@example-pooler.neon.tech/database
      DATABASE_URL_UNPOOLED: postgresql://user:password@example.neon.tech/database
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      ADMIN_AUTH_SECRET: ci-admin-secret-with-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm

      - name: Use project npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate migration history
        run: npm run db:check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
